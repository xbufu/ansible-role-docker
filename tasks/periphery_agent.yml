---
- name: Ensure periphery root directory exists
  ansible.builtin.file:
    path: "{{ periphery_root_dir }}"
    state: directory
    mode: '0755'

- name: Install or upgrade periphery binary
  ansible.builtin.include_tasks: periphery_binary.yml

# force: false so a re-run never overwrites a config with hand-added [secrets]
- name: Deploy periphery config if missing
  ansible.builtin.template:
    src: periphery.config.toml.tpl
    dest: "{{ periphery_root_dir }}/periphery.config.toml"
    mode: '0600'
    force: false
  notify: Restart periphery

- name: Restrict periphery config permissions
  ansible.builtin.file:
    path: "{{ periphery_root_dir }}/periphery.config.toml"
    owner: root
    group: root
    mode: '0600'

- name: Update periphery service file to use correct config path
  ansible.builtin.template:
    src: periphery.service.tpl
    dest: /etc/systemd/system/periphery.service
    mode: '0644'
  notify: Restart periphery

- name: Ensure periphery service is enabled and started
  ansible.builtin.systemd:
    name: periphery
    state: started
    enabled: true
    daemon_reload: true
