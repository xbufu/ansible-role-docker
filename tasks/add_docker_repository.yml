---
# Older role versions trusted the key for all repos via trusted.gpg.d; drop that line first,
# otherwise apt fails on two conflicting Signed-By values for the same repo.
- name: Remove Docker source line that uses the old key location
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/docker.list
    regexp: 'trusted\.gpg\.d/docker\.gpg'
    state: absent

- name: Remove old Docker gpg keys
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/trusted.gpg.d/docker.gpg
    - /etc/apt/trusted.gpg.d/docker.gpg_armored

- name: Set distribution vars (remap Kali to Debian)
  ansible.builtin.set_fact:
    _docker_distribution: "{{ 'Debian' if ansible_facts['distribution'] == 'Kali' else ansible_facts['distribution'] }}"
    _docker_distribution_release: "{{ 'bookworm' if ansible_facts['distribution'] == 'Kali' else ansible_facts['distribution_release'] }}"

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker gpg key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ _docker_distribution | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

# https://git.deuxfleurs.fr/Deuxfleurs/infrastructure/src/commit/7852eef5a6d0eefc5914f178549f6845857a5c49/os/config/roles/common/tasks/docker.yml
- name: Add Docker's repository to APT sources list
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ architecture_map[ansible_facts['architecture']] }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ _docker_distribution | lower }} {{ _docker_distribution_release }} stable"
    state: present
    filename: docker
    update_cache: true
  vars:
    architecture_map:
      "x86_64": "amd64"
      "aarch64": "arm64"
      "aarch": "arm64"
      "armhf": "armhf"
      "armv7l": "armhf"
